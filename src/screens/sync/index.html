<!-- Title -->
<h1>Sync</h1>

<!-- Content -->
<div class="page-content">
    <!-- Back -->
    <button id="sync-back">Back</button>

    <!-- Actions -->
    <div class="page-vc">
        <!-- Title -->
        <h2>Actions</h2>

        <!-- Start server -->
        <div class="item">
            <div class="item-text">
                <div class="item-title">Start server</div>
                <div class="item-description">Starts the background server, if not already running.</div>
            </div>
            <button id="sync-start-server">Start</button>
        </div>

        <!-- Sync albums -->
        <div class="item">
            <div class="item-text">
                <div class="item-title">Sync albums</div>
                <div class="item-description">Synchronizes your albums from your phone to your computer.</div>
            </div>
            <button id="sync-albums">Sync</button>
        </div>

        <!-- Sync metadata -->
        <div class="item">
            <div class="item-text">
                <div class="item-title">Sync metadata</div>
                <div class="item-description">Synchronizes your metadata files from your phone to your computer or viceversa.</div>
            </div>
            <button id="sync-metadata">Sync</button>
        </div>
    </div>
</div>
