<!-- Title -->
<h1>Metadata</h1>

<!-- Loading indicator -->
<loading id="metadata-loading"></loading>

<!-- Content -->
<div id="metadata-content" class="page-content">
    <!-- Back -->
    <button id="metadata-back">Back</button>

    <!-- Actions -->
    <div class="page-vc">
        <!-- Title -->
        <h2>Actions</h2>

        <!-- Search albums -->
        <div class="item">
            <div class="item-text">
                <div class="item-title">Search albums</div>
                <div class="item-description">Searches for items whose metadata contains a specified query.</div>
            </div>
            <button>Search</button>
        </div>

        <!-- Clean metadata -->
        <div class="item">
            <div class="item-text">
                <div class="item-title">Clean metadata</div>
                <div class="item-description">Removes metadata keys for files that don't exist & sorts the remaining keys by modified date.</div>
            </div>
            <button>Start</button>
        </div>

        <!-- Fix metadata -->
        <div class="item">
            <div class="item-text">
                <div class="item-title">Generate metadata</div>
                <div class="item-description">Generates metadata for all missing files or fields.</div>
            </div>
            <button>Start</button>
        </div>
    </div>
</div>
